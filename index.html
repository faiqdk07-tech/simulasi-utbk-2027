@media(max-width:820px){

 .txt,.q{font-size:16px}.o{font-size:17px}.f{grid-template-columns:1fr}
}

<script>

var $=function(i){return document.getElementById(i)},Q=[],A=[],M=[],cur=0,edit=false;
function ea(v){return esc(v||'').replace(/"/g,'&quot;')}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\u0001([^\u0002]*)\u0002/g,function(m,u){var src;try{src=decodeURIComponent(u)}catch(e){return ''}return '<img class="qi" src="'+src.replace(/"/g,'%22').replace(/</g,'%3C').replace(/>/g,'%3E')+'" alt="gambar soal" onerror="this.replaceWith(document.createTextNode(\'[gambar tidak dapat dimuat]\'))">'}).replace(/\n/g,'<br>')}
function itk(src){src=(src||'').trim();if(!/^(https?:\/\/\S+|data:image\/[a-z+]+[;,]\S+|[\w.\/-]+\.(png|jpe?g|gif|webp|svg))$/i.test(src))return null;return '\u0001'+encodeURIComponent(src).replace(/\*/g,'%2A')+'\u0002'}
function imgs(raw){
 raw=raw.replace(/<svg[\s\S]*?<\/svg>/gi,function(m){if(!/<svg[^>]*xmlns/i.test(m))m=m.replace(/<svg/i,'<svg xmlns="http://www.w3.org/2000/svg"');return itk('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(m))});
 raw=raw.replace(/<img\b[^>]*?\bsrc\s*=\s*["']([^"']+)["'][^>]*>/gi,function(m,u){return itk(u)||''});
 raw=raw.replace(/!\[[^\]]*\]\(\s*([^)\s]+)[^)]*\)/g,function(m,u){return itk(u)||m});
 raw=raw.replace(/^[ \t]*\(?Gambar\s*[:：]\s*(\S+)[ \t]*$/gim,function(m,u){return itk(u)||m});
 return raw;
}
function bsline(l){
 var r;
 if(r=l.match(/^\s*\(?(?:BS|B\/S|Benar[\s\-\/]*Salah)\s*[:：]\s*(.*)$/i))return r[1].trim();
 if(/^\s*\|/.test(l)){
  var cells=l.split('|').map(function(x){return x.trim()}).filter(Boolean);
  if(!cells.length||cells.every(function(x){return /^:?-{2,}:?$/.test(x)}))return '';
  var tx=cells.filter(function(x){return !/^\d+[.)]?$/.test(x)&&!/^(benar|salah|b|s|pernyataan|no\.?|nomor|[○◯□☐✓✗xX\s]*)$/i.test(x)});
  return tx.join(' ');
 }
 if(r=l.match(/^\s*(?:\d+[.)]\s+)?(.*?)\s*\((?:Benar\s*\/\s*Salah|B\s*\/\s*S|Benar\s+atau\s+Salah)\)\s*$/i))return r[1].trim();
 return null;
}
function dec(s){var keep=[];s=s.replace(/data:image\/[a-z+]+[;,][^\s)"']+/gi,function(m){keep.push(m);return'\u0003'+(keep.length-1)+'\u0004'});if((s.match(/%[0-9A-Fa-f]{2}/g)||[]).length>=5)s=s.replace(/(?:%[0-9A-Fa-f]{2})+/g,function(m){try{return decodeURIComponent(m)}catch(e){return m}});return s.replace(/\u0003(\d+)\u0004/g,function(m,i){return keep[+i]})}
function parse(raw){
 raw=dec(raw);
 var out=[],prev='',c=null;
 raw=raw.replace(/\r\n|\r|[\u2028\u2029\u0085]/g,'\n');
 raw=imgs(raw);
 var ns=(raw.match(/Soal\s*[:：]/gi)||[]).length;

  raw=raw.replace(/\s*(Teks|Soal)\s*[:：]/gi,'\n$1:').replace(/\s+(?=\(?[A-E][.)]\s)/g,'\n').replace(/\s*(?:-{3,}|—)\s*/g,'\n---\n');
 }
 function push(){
  if(!c)return;
  var qq=c.q.join('\n').trim();
  if(qq||c.o.length||c.b.length){var tt=c.t.join('\n').trim();if(tt=='=')tt=prev;else if(tt)prev=tt;out.push({t:tt,q:qq,o:c.o,b:c.b});}

 }
 function nw(){push();c={m:'',t:[],q:[],o:[],b:[]};}
 raw.split('\n').forEach(function(l){

  if(/^\s*(?:[-—–_=*]{3,}|[—–])\s*$/.test(l)){push();return}
  if(!l.trim()){if(c&&c.m=='t')c.t.push('');else if(c&&c.m=='q')c.q.push('');return}
  if(!c)nw();
  if(r=l.match(/^\s*\(?Teks\s*[:：]\s?(.*)$/i)){if(c.m=='o'||c.m=='q')nw();c.m='t';c.t.push(r[1]);}
  else if(r=l.match(/^\s*\(?Soal\s*[:：]\s?(.*)$/i)){if(c.m=='o')nw();c.m='q';c.q.push(r[1]);}
  else if(c.m!='t'&&c.m!='o'&&(bs=bsline(l))!==null){if(bs!==''){c.m='b';c.b.push(bs);}}
  else if(c.m!='t'&&(r=l.match(/^\s*\(?([A-Ja-j])[.)]\s+(.*)$/))){c.m='o';c.o.push(r[2]);}
  else if(c.m=='o'){
   if(r=l.match(/^\s*\d+[.)]\s+(.*)$/)){nw();c.m='q';c.q.push(r[1]);}
   else if(c.o.length)c.o[c.o.length-1]+=' '+l.trim();
  }
  else if(c.m=='b'){if(r=l.match(/^\s*\d+[.)]\s+(.*)$/))c.b.push(r[1]);else c.b[c.b.length-1]+=' '+l.trim();}
  else if(c.m=='t')c.t.push(l);
  else{c.m='q';c.q.push(l.replace(/^\s*\d+[.)]\s+/,''));}
 });
 push();
 return out;
}

 +'<div class="lb">Daftar soal (tempel di sini)</div><textarea id="ta" spellcheck="false"></textarea>'
 +'<div class="gd">Format: <code>Teks:</code> bacaan (boleh kosong atau banyak baris; <code>Teks: =</code> artinya sama dengan soal sebelumnya), <code>Soal:</code> pertanyaan, lalu pilihan <code>A.</code> <code>B.</code> <code>C.</code> dst. Pisahkan antarsoal dengan baris <code>---</code>. Miring: <code>*teks*</code>, tebal: <code>**teks**</code>. Format sederhana juga bisa: <code>1. pertanyaan</code> lalu pilihan <code>A.</code> <code>B.</code> dst (tanpa kata Soal). Cek angka “soal terbaca” di bawah sebelum klik Terapkan. Gambar: tulis <code>Gambar: https://alamat-gambar.png</code> atau <code>![](alamat-gambar)</code>, atau tempel kode <code>&lt;svg&gt;…&lt;/svg&gt;</code> langsung. Benar/Salah: tulis tiap pernyataan di baris sendiri diawali <code>BS:</code> (atau diakhiri <code>(Benar/Salah)</code>). Isian: tulis <code>Soal:</code> saja tanpa pilihan A. B. C. Tip: minta Claude membuat soal dalam format ini, lalu tempel.</div>'
 +'<div class="row"><button class="btn p" id="ap">Terapkan &amp; Mulai</button><button class="btn" id="bt">Batal</button><button class="btn" id="cx" style="color:#c62828;border-color:#c62828">🗑 Hapus teks</button><span class="cnt" id="ct"></span></div>';
 var ta=$('ta');ta.value=dec(D.raw);
 var cnt=function(){$('ct').textContent=parse(ta.value).length+' soal terbaca'};cnt();ta.oninput=cnt;
 $('bt').onclick=function(){edit=false;soal()};
 $('cx').onclick=function(){ta.focus();ta.select();var ok=false;try{ok=document.execCommand('delete')}catch(e){}if(!ok||ta.value)ta.value='';ta.scrollTop=0;cnt();ta.focus()};
 $('ap').onclick=function(){
  var nn=parse(ta.value).length;
  if(!nn){$('ct').innerHTML='<b style="color:#c00">0 soal terbaca ('+ta.value.length+' karakter, '+ta.value.split('\n').length+' baris; awal teks: “'+esc(ta.value.slice(0,50))+'”). Tempel soal di kolom besar ini, pakai Soal: lalu pilihan A. B. C.</b>';return}
  D.subject=$('f1').value;D.subchapter=$('f2').value;D.kode=$('f3').value;
  if(dec(ta.value)!==D.raw){D.raw=dec(ta.value);D.A=[];D.M=[];cur=0}
  load();save();edit=false;soal();
 };
}
function persist(){D.A=A;D.M=M;save()}
function hasil(){
 var L=[],c=0;
 Q.forEach(function(_,i){if(dn(i))c++;L.push((i+1)+'. '+(Array.isArray(A[i])?(A[i].some(function(x){return x>=0})?A[i].map(function(x){return x<0?'-':x==0?'B':'S'}).join(', '):'-'):!dn(i)?'-':typeof A[i]=='string'?A[i]:String.fromCharCode(65+A[i])))});
 return [D.kode,D.subject,D.subchapter].filter(function(x){return x&&x.trim()}).join(' | ')+'\nTerjawab: '+c+'/'+Q.length+'\n\n'+L.join('\n');
}
$('grid').onclick=function(e){var b=e.target.closest('.nb');if(b){edit=false;cur=+b.dataset.i;soal();}};
$('body').onclick=function(e){
 if(edit)return;
 var bb=e.target.closest('.bsb');if(bb){var k=+bb.dataset.k,v=+bb.dataset.v;if(!Array.isArray(A[cur]))A[cur]=Q[cur].b.map(function(){return-1});A[cur][k]=A[cur][k]===v?-1:v;persist();soal();return}
 var o=e.target.closest('.o');if(o){var n=+o.dataset.n;A[cur]=A[cur]===n?-1:n;persist();soal();}
};
$('bm').onclick=function(){if(edit||!Q.length)return;M[cur]=!M[cur];persist();soal();};
$('pv').onclick=function(){if(cur>0){cur--;soal();}};
$('nx').onclick=function(){if(cur<Q.length-1){cur++;soal();}else if(Q.length){finish();}};
function openEd(){edit=true;soal();$('body').scrollIntoView({behavior:'smooth'});}
$('ed').onclick=openEd;$('ed2').onclick=openEd;
function finish(){$('tnote').style.display='none';$('res').value=hasil();$('ov').classList.add('on');}
$('cl').onclick=function(){$('ov').classList.remove('on');$('tnote').style.display='none'};
$('rs').onclick=function(){if(confirm('Hapus semua jawaban?')){A=blank();M=Q.map(function(){return false});persist();$('ov').classList.remove('on');soal();}};
$('cp').onclick=function(){
 var t=$('res'),ok=function(){$('cp').textContent='Tersalin ✓'};
 t.focus();t.select();
 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(ok,function(){document.execCommand('copy')&&ok()});return}}catch(e){}
 try{document.execCommand('copy')&&ok()}catch(e){}
};
/* ===== TIMER (diatur & dimulai manual oleh pengguna) ===== */
var T=D.T||{dur:1800,rem:1800},tstate='idle',tend=0,tick=null,lastSave=0;
if(!(T.dur>0))T={dur:1800,rem:1800};
if(!(T.rem>=0)||T.rem>T.dur)T.rem=T.dur;
tstate=(T.rem>0&&T.rem<T.dur)?'paused':(T.rem<=0?'done':'idle');
function pad(n){return(n<10?'0':'')+n}
function fmtT(sec){sec=Math.max(0,Math.ceil(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return(h?h+':'+pad(m):pad(Math.floor(sec/60)))+':'+pad(s)}
function saveT(){D.T={dur:T.dur,rem:T.rem};save()}
function readInputs(){
 var m=Math.max(0,Math.min(999,parseInt($('tmin').value,10)||0)),s=Math.max(0,Math.min(59,parseInt($('tsec').value,10)||0));
 return m*60+s;
}
function showInputs(){$('tmin').value=Math.floor(T.dur/60);$('tsec').value=T.dur%60}
function tui(){
 var v=$('tmv'),run=tstate=='running';
 v.textContent=fmtT(T.rem);
 v.className='tmv'+(tstate=='done'?' end':(T.rem<=60&&tstate!='idle'?' warn':''));
 $('tmin').disabled=$('tsec').disabled=tstate!='idle';
 $('tst').textContent={idle:'Siap',running:'Berjalan',paused:'Dijeda',done:'Waktu habis'}[tstate];
 var g=$('tgo');
 g.textContent={idle:'Mulai',running:'Jeda',paused:'Lanjut',done:'Mulai'}[tstate];
 g.disabled=(tstate=='idle'&&T.dur<=0);
 document.title=(run||tstate=='paused'?'['+fmtT(T.rem)+'] ':'')+'Simulasi TO UTBK';
}
function beep(){
 try{
  var C=window.AudioContext||window.webkitAudioContext,a=new C(),t=a.currentTime;
  [0,0.35,0.7].forEach(function(d){var o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(0.2,t+d);g.gain.exponentialRampToValueAtTime(0.001,t+d+0.25);o.start(t+d);o.stop(t+d+0.3)});
 }catch(e){}
}
function timeUp(){
 clearInterval(tick);tick=null;tstate='done';T.rem=0;saveT();tui();beep();
 try{if(navigator.vibrate)navigator.vibrate([300,150,300])}catch(e){}
 $('res').value=hasil();$('tnote').style.display='block';$('ov').classList.add('on');
}
function loop(){
 T.rem=(tend-Date.now())/1000;
 if(T.rem<=0){timeUp();return}
 var n=Date.now();if(n-lastSave>1000){lastSave=n;saveT()}
 tui();
}
function tstart(){
 if(tstate=='done'||tstate=='idle'&&T.rem<=0)T.rem=T.dur;
 if(tstate=='idle'){T.dur=readInputs();if(T.dur<=0)return;T.rem=T.dur;showInputs()}
 tend=Date.now()+T.rem*1000;tstate='running';
 clearInterval(tick);tick=setInterval(loop,250);saveT();tui();
}
function tpause(){clearInterval(tick);tick=null;T.rem=Math.max(0,(tend-Date.now())/1000);tstate='paused';saveT();tui()}
function treset(){
 if(tstate=='running'||tstate=='paused'){if(!confirm('Reset timer ke awal?'))return}
 clearInterval(tick);tick=null;tstate='idle';
 if(T.dur<=0)T.dur=1800;T.rem=T.dur;showInputs();saveT();tui();
}
$('tgo').onclick=function(){if(tstate=='running')tpause();else tstart()};
$('trs').onclick=treset;
function onSet(){if(tstate!='idle')return;T.dur=readInputs();T.rem=T.dur;saveT();tui()}
$('tmin').oninput=$('tsec').oninput=onSet;
$('tmin').onchange=$('tsec').onchange=function(){if(tstate=='idle'){showInputs()}};
showInputs();tui();

load();soal();
</script>
