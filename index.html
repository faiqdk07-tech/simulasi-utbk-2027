<style>

.cbk:hover{background:#dce6fa}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:0 12px 12px}
.ck{height:42px;border-radius:8px;border:1.5px solid #dde3ef;background:#fff;color:#111;font:600 17px 'Manrope',sans-serif;cursor:pointer;padding:0;transition:background .1s}
.ck:hover{background:#f4f6fb}.ck:active{background:#e6ecf8}
.ck.op{background:#e8effc;border-color:#d3def7;color:#2f5fc7}.ck.op:hover{background:#dbe5fa}

.ck.eq{background:#4a7de8;border-color:#4a7de8;color:#fff}.ck.eq:hover{background:#3d6fd8}

var T=D.T||{dur:1800,rem:1800},tstate='idle',tend=0,tick=null,lastSave=0;

  [0,0.35,0.7].forEach(function(d){var o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(0.2,t+d);g.gain.exponentialRampToValueAtTime(0.001,t+d+0.25);o.start(t+d);o.stop(t+d+0.3)});

var CX='',CDONE=false;
function cEval(s){
 var t=[],i=0,prev=null,m;
 while(i<s.length){
  var ch=s[i];
  if(m=s.slice(i).match(/^(\d+\.?\d*|\.\d+)/)){
   if(prev&&(prev.n!==undefined||prev.v==')'))t.push({v:'×'});
   prev={n:parseFloat(m[1])};t.push(prev);i+=m[1].length;continue;
  }
  if(ch=='('||ch=='√'){if(prev&&(prev.n!==undefined||prev.v==')'))t.push({v:'×'});}
  if(ch=='−'&&(!prev||(prev.n===undefined&&prev.v!=')')))ch='u';
  prev={v:ch};t.push(prev);i++;
 }
 var P={'+':1,'−':1,'×':2,'÷':2,'u':3,'√':4},R={'u':1,'√':1},out=[],st=[];
 t.forEach(function(k){
  if(k.n!==undefined)out.push(k);
  else if(k.v=='(')st.push(k);
  else if(k.v==')'){while(st.length&&st[st.length-1].v!='(')out.push(st.pop());if(!st.length)throw 0;st.pop();}
  else{if(!P[k.v])throw 0;
   while(st.length&&st[st.length-1].v!='('&&!R[k.v]&&P[st[st.length-1].v]>=P[k.v])out.push(st.pop());
   st.push(k);}
 });
 while(st.length){var o=st.pop();if(o.v=='(')continue;out.push(o);}
 var S=[];
 out.forEach(function(k){
  if(k.n!==undefined){S.push(k.n);return}
  if(R[k.v]){if(!S.length)throw 0;var a=S.pop();if(k.v=='u')S.push(-a);else{if(a<0)throw 0;S.push(Math.sqrt(a))}return}
  if(S.length<2)throw 0;var b=S.pop(),x=S.pop();
  if(k.v=='+')S.push(x+b);else if(k.v=='−')S.push(x-b);else if(k.v=='×')S.push(x*b);else{if(b===0)throw 0;S.push(x/b)}
 });
 if(S.length!=1||!isFinite(S[0]))throw 0;
 return S[0];
}
function cFmt(n){var r=parseFloat(n.toPrecision(12));if(Object.is(r,-0))r=0;var a=Math.abs(r);return(a!==0&&(a>=1e12||a<1e-9))?r.toExponential(6).replace(/\.?0+e/,'e'):String(r)}
function cShow(err){
 var e=$('cex'),r=$('cres');
 r.classList.remove('err');
 if(err){e.textContent=CX;r.textContent='Tidak valid';r.classList.add('err');return}
 if(CDONE){r.textContent=CX;return}
 e.textContent=CX;
 var pv='';try{if(CX&&/[+−×÷√]/.test(CX))pv=cFmt(cEval(CX))}catch(x){}
 r.textContent=pv||CX||'0';
 r.scrollLeft=r.scrollWidth;e.scrollLeft=e.scrollWidth;
}
function cKey(k){
 var last=CX.slice(-1),ops='+−×÷';
 if(CDONE){
  if(ops.indexOf(k)>=0){CDONE=false;$('cex').textContent='';}
  else if(k!='='){CDONE=false;CX='';$('cex').textContent='';}
 }
 if(k=='C'){CX='';}
 else if(k=='bk'){CX=CX.slice(0,-1);}
 else if(k=='='){
  if(!CX)return;
  var opn=(CX.match(/\(/g)||[]).length-(CX.match(/\)/g)||[]).length,ex=CX+Array(Math.max(0,opn)+1).join(')');
  try{var v=cFmt(cEval(ex));$('cex').textContent=ex+' =';CX=(v.indexOf('e')>=0?Number(v).toLocaleString('en-US',{useGrouping:false,maximumFractionDigits:20}):v).replace('-','−');CDONE=true;$('cres').classList.remove('err');$('cres').textContent=v;}
  catch(x){cShow(true)}
  return;
 }
 else if(ops.indexOf(k)>=0){
  if(!CX||last=='('||last=='√'){if(k=='−')CX+=k;}
  else if(ops.indexOf(last)>=0){
   if(k=='−'&&(last=='×'||last=='÷'))CX+=k;
   else{CX=CX.replace(/[+−×÷]+$/,'');if(CX&&!/[(√]$/.test(CX))CX+=k;else if(k=='−')CX+=k;}
  }
  else CX+=k;
 }
 else if(k=='.'){
  var seg=CX.match(/[\d.]*$/)[0];
  if(seg.indexOf('.')<0)CX+=(seg?'':'0')+'.';
 }
 else if(k==')'){
  var o=(CX.match(/\(/g)||[]).length-(CX.match(/\)/g)||[]).length;
  if(o>0&&/[\d.)]$/.test(CX))CX+=')';
 }
 else if(k=='√'){CX+='√(';}
 else CX+=k;
 if(CX.length>60)CX=CX.slice(0,60);

}
